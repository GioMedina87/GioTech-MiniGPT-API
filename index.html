<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>GioTech MiniGPT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- ⚡ GioTech Neon Boot Screen -->
    <div id="boot-screen">
        <div class="boot-inner">
            <h1 class="boot-title">GioTech MiniGPT</h1>
            <p class="boot-subtitle">Booting Medina OpenAI Engine…</p>

            <div class="boot-steps">
                <p id="boot-line-1" class="boot-line">Starting core systems…</p>
                <p id="boot-line-2" class="boot-line">Linking to OpenAI…</p>
                <p id="boot-line-3" class="boot-line">Warming up Render server…</p>
                <p id="boot-line-4" class="boot-line">Preparing chat interface…</p>
            </div>

            <div class="boot-bar">
                <div class="boot-bar-fill"></div>
            </div>

            <div class="boot-dots">
                <span></span><span></span><span></span><span></span>
            </div>

            <p class="boot-hint">If this takes a bit, Render is waking up 😅</p>
        </div>
    </div>

    <!-- ⚡ Main App UI -->
    <div class="app-shell hidden">
        <header class="chat-header">
            <div class="title-group">
                <h1>GioTech MiniGPT</h1>
                <p class="subtitle">Powered by Medina OpenAI • Local API on <code>localhost:4000</code></p>
            </div>

            <div class="status-pill" id="status-pill">
                <span class="status-dot"></span>
                <span class="status-text">Connecting…</span>
            </div>
        </header>

        <main class="chat-window">
            <div class="messages" id="messages"></div>
        </main>

        <form id="chat-form" class="input-bar" autocomplete="off">
            <input type="text" id="user-input" placeholder="Type a message and press Enter…" />
            <button id="send-btn" type="submit">SEND</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
